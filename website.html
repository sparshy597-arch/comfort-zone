<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comfort Zone — One social challenge at a time</title>
<meta name="description" content="A social-confidence app: one real-world challenge at a time, sized to how anxious you actually feel.">
<script>document.documentElement.classList.add("js")</script>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #f4f4f2;
  --surface-2: #ebeae6;
  --ink: #1f2b4d;
  --muted: #5c6378;
  --accent: #f7941d;
  --accent-ink: #1f2b4d;
  --field-1: #05070a;  --field-1-ink: #ffffff;
  --field-2: #e3e1dc;  --field-2-ink: #1f2b4d;
  --paper: #ffffff;

  --step-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
  --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
  --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
  --step-head: clamp(2rem, 1.3rem + 3.2vw, 4rem);
  --step-display: clamp(3.5rem, 10.5vw, 10.5rem);

  --margin: clamp(16px, 2.4vw, 32px);
  --gutter: clamp(12px, 1.6vw, 24px);
  --gap: clamp(120px, 14vw, 200px);
  --radius: 20px;
  --ease: cubic-bezier(.2, .7, .1, 1);
  --font: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: var(--step-body); line-height: 1.45; letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
h1, h2, h3 { font-weight: 500; letter-spacing: -0.045em; line-height: 0.95; margin: 0; }
p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; letter-spacing: inherit; }
input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
::selection { background: var(--accent); color: var(--accent-ink); }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); padding: 0 var(--margin); }
.muted { color: var(--muted); }
.small { font-size: var(--step-small); }
.lead { font-size: var(--step-lead); line-height: 1.3; letter-spacing: -0.015em; }
.head { font-size: var(--step-head); }

/* buttons: one shape, fully round */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 52px; padding: 0 1.6em; border-radius: 999px; font-weight: 500; white-space: nowrap;
  transition: transform .25s var(--ease), background-color .2s, color .2s, opacity .2s;
}
.btn:active { transform: scale(.96); }
.btn-accent { background: var(--accent); color: var(--accent-ink); }
.btn-accent:hover { background: #ff9f2e; }
.btn-ink { background: var(--ink); color: var(--paper); }
.btn-ink:hover { background: #2b3a63; }
.btn-soft { background: var(--surface); color: var(--ink); }
.btn-soft:hover { background: var(--surface-2); }
.btn:disabled { opacity: .35; cursor: default; transform: none; }
.link { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .25em; transition: color .2s; }
.link:hover { color: var(--muted); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 30; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between;
  height: 64px; padding: 0 var(--margin); font-size: var(--step-small);
  transition: transform .4s var(--ease);
}
.bar.hide { transform: translateY(-100%); }
.wordmark { font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
.bar nav { display: flex; gap: clamp(16px, 3vw, 44px); align-items: center; }
.bar nav a, .bar nav button { color: var(--muted); transition: color .2s; }
.bar nav a:hover, .bar nav button:hover, .bar nav .on { color: var(--ink); }
.bar .cta { color: var(--ink); font-weight: 500; }
@media (max-width: 640px) { .bar .wide { display: none; } }

/* ---------- entrances ---------- */
.js [data-rise] { opacity: 0; transform: translateY(26px); transition: opacity .9s var(--ease), transform .9s var(--ease); transition-delay: calc(var(--d, 0) * 80ms); }
.js [data-rise].in { opacity: 1; transform: none; }
.view { animation: viewin .6s var(--ease); }
@keyframes viewin { from { opacity: 0; transform: translateY(14px); } }

/* ---------- hero ---------- */
.hero { min-height: calc(100svh - 64px); display: grid; grid-template-rows: 1fr auto; padding-bottom: clamp(24px, 4vh, 48px); }
.hero h1 {
  align-self: center; justify-self: center; display: inline-flex; align-items: baseline; gap: .12em;
  font-size: var(--step-display); font-weight: 600; letter-spacing: -0.05em; line-height: .9; white-space: nowrap;
}
.slot { display: inline-block; width: 1.6em; height: .72em; overflow: hidden; position: relative; align-self: baseline; }
.slot img { width: 100%; height: 100%; object-fit: cover; }
.js .slot { clip-path: inset(0 100% 0 0); animation: shutter 1.1s .25s var(--ease) forwards; }
.js .slot img { transform: scale(1.12); animation: settle 1.4s .25s var(--ease) forwards; }
@keyframes shutter { to { clip-path: inset(0 0 0 0); } }
@keyframes settle { to { transform: scale(1); } }
.hero-foot { align-items: end; row-gap: 20px; }
.hero-foot p { grid-column: 1 / span 6; max-width: 34ch; }
.hero-foot .act { grid-column: 9 / -1; justify-self: end; display: flex; gap: 20px; align-items: center; }
@media (max-width: 760px) {
  .hero h1 { flex-direction: column; align-items: center; font-size: 19vw; gap: .14em; }
  .slot { width: calc(100vw - 32px); height: calc((100vw - 32px) * .62); font-size: 1rem; }
  .hero-foot p, .hero-foot .act { grid-column: 1 / -1; justify-self: stretch; }
  .hero-foot .act { flex-direction: column-reverse; align-items: stretch; gap: 14px; text-align: center; }
}

/* ---------- zoom scene ---------- */
.zoom { height: 260vh; position: relative; }
.zoom-stage { position: sticky; top: 0; height: 100svh; overflow: hidden; }
.zoom-pic { position: absolute; inset: 0; clip-path: inset(var(--iy, 22%) var(--ix, 28%)); will-change: clip-path; }
.zoom-pic img { width: 100%; height: 100%; object-fit: cover; transform: scale(var(--zs, 1.18)); will-change: transform; }
.zoom-card {
  position: absolute; left: var(--margin); bottom: var(--margin); width: min(440px, calc(100% - 2 * var(--margin)));
  background: var(--paper); border-radius: var(--radius); padding: 28px;
  opacity: 0; transform: translateY(40px); transition: opacity .7s var(--ease), transform .7s var(--ease);
}
.zoom-card.on { opacity: 1; transform: none; }
.zoom-card h2 { font-size: var(--step-lead); letter-spacing: -0.02em; line-height: 1.15; margin-top: 10px; }
.zoom-card ul { margin-top: 20px; display: grid; gap: 8px; }
.zoom-card li { background: var(--surface); border-radius: 12px; padding: 12px 16px; font-size: var(--step-small); }
.zoom-card li.sel { background: var(--ink); color: var(--paper); }
@media (max-width: 760px) { .zoom-card { padding: 22px; } }

/* ---------- gap (predicted vs actual) ---------- */
.gapsec { padding-top: var(--gap); align-items: center; }
.gapsec .say { grid-column: 1 / span 5; }
.gapsec .say p { margin-top: 28px; max-width: 40ch; }
.gapsec .proof { grid-column: 7 / -1; position: relative; padding-bottom: 120px; }
.gapsec .proof figure { aspect-ratio: 4 / 5; overflow: hidden; width: 78%; margin-left: auto; }
.gapsec .proof figure img { width: 100%; height: 115%; object-fit: cover; transform: translateY(var(--py, 0)); }
.ui-card { background: var(--surface); border-radius: var(--radius); padding: 26px; }
.gapsec .ui-card { position: absolute; left: 0; bottom: 0; width: min(400px, 82%); }
.ui-meta { font-size: var(--step-small); color: var(--muted); }
.ui-title { font-size: var(--step-lead); font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; margin-top: 6px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
.pair div { background: var(--paper); border-radius: 14px; padding: 14px 16px; }
.pair b { display: block; font-size: var(--step-head); font-weight: 500; letter-spacing: -0.05em; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.pair .was b { color: var(--muted); }
@media (max-width: 860px) {
  .gapsec .say, .gapsec .proof { grid-column: 1 / -1; }
  .gapsec .proof { margin-top: 48px; }
  .gapsec .proof figure { width: 88%; }
  .gapsec .ui-card { width: 88%; }
}

/* ---------- stages bar ---------- */
.stages { padding-top: var(--gap); }
.stages h2 { grid-column: 1 / -1; font-size: var(--step-head); }
.stagebar { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 64px; }
.seg { min-width: 12%; }
.seg .blk { height: 22vh; min-height: 150px; padding: 20px; font-size: var(--step-lead); letter-spacing: -0.02em; transform-origin: left; }
.js .seg .blk { transform: scaleX(0); transition: transform 1.1s var(--ease); transition-delay: calc(var(--d) * 140ms); }
.js .stagebar.in .blk { transform: none; }
.seg .blk span { display: block; transition: opacity .5s .6s; }
.js .seg .blk span { opacity: 0; }
.js .stagebar.in .blk span { opacity: 1; }
.seg p { margin-top: 16px; max-width: 24ch; }
.s1 .blk { background: var(--field-2); color: var(--field-2-ink); }
.s2 .blk { background: var(--ink); color: var(--paper); }
.s3 .blk { background: var(--field-1); color: var(--field-1-ink); }
@media (max-width: 760px) {
  .stagebar { flex-direction: column; }
  .seg { flex: none !important; }
  .s1 .blk { height: 12svh; } .s2 .blk { height: 34svh; } .s3 .blk { height: 14svh; }
  .seg .blk { min-height: 84px; font-size: 19px; transform-origin: top; }
  .js .seg .blk { transform: scaleY(0); }
}

/* ---------- colour fields (stacking) ---------- */
.fields { margin-top: var(--gap); }
.field { position: relative; height: 80svh; clip-path: inset(var(--ci, 0px) var(--cx, 0px) round var(--cr, 0px)); min-height: 520px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); padding: 28px var(--margin); }
.field p { grid-column: 8 / span 4; grid-row: 1; align-self: start; max-width: 30ch; font-size: var(--step-body); }
.field h2 { grid-column: 1 / -1; grid-row: 2; align-self: end; font-size: var(--step-display); font-weight: 600; line-height: .9; }
.field.mirror p { grid-column: 2 / span 4; }
.field.mirror h2 { text-align: right; }
.f1 { background: var(--field-1); color: var(--field-1-ink); }
.f2 { background: var(--ink); color: var(--paper); }
.f3 { background: var(--field-2); color: var(--field-2-ink); }
.field { grid-template-rows: auto 1fr; }
@media (max-width: 760px) {
  .field { height: 64svh; min-height: 440px; }
  .field p, .field.mirror p { grid-column: 1 / span 11; }
  .field.mirror p { text-align: right; grid-column: 2 / -1; }
  .field h2, .field.mirror h2 { font-size: 15vw; text-align: left; }
}

/* ---------- photo band ---------- */
.band { padding-top: var(--gap); overflow: hidden; }
.band-head { align-items: end; }
.band-head h2 { grid-column: 1 / span 7; font-size: var(--step-head); }
.band-head p { grid-column: 8 / -1; max-width: 40ch; }
.track { padding-top: 64px; align-items: start; }
.track figure { grid-column: span 4; }
.track figure:nth-child(2) { margin-top: 12vh; }
.track figure:nth-child(3) { margin-top: 4vh; }
.track .pic { aspect-ratio: 4 / 5; overflow: hidden; background: var(--surface); }
.track .pic img { width: 100%; height: 118%; object-fit: cover; transform: translateY(var(--py, 0)); scale: var(--hs, 1); transition: scale 1.2s var(--ease); }
.track figure:hover .pic img { --hs: 1.04; }
.track .pic.bars img { height: 100%; --hs: 1.36; }
.track figure:hover .pic.bars img { --hs: 1.4; }
.track figcaption { margin-top: 16px; }
.track figcaption b { display: block; font-weight: 500; font-size: var(--step-lead); letter-spacing: -0.02em; }
@media (max-width: 760px) {
  .band-head h2, .band-head p { grid-column: 1 / -1; }
  .band-head p { margin-top: 20px; }
  .track figure { grid-column: 1 / -1; margin-top: 0 !important; }
  .track figure + figure { margin-top: 48px !important; }
}

/* ---------- live input ---------- */
.tryit { padding-top: var(--gap); }
.tryit h2 { grid-column: 1 / -1; font-size: var(--step-head); }
.typeline { grid-column: 1 / -1; margin-top: 40px; }
.typeline input {
  width: 100%; border: 0; background: transparent; outline: none; padding: 0;
  font-size: var(--step-display); font-weight: 600; letter-spacing: -0.05em; line-height: 1.05; color: var(--ink);
  caret-color: var(--accent);
}
.typeline input:focus-visible { outline: none; }
.answer { grid-column: 1 / span 6; margin-top: 48px; max-width: 560px; }

.answer ul { margin-top: 16px; display: grid; gap: 8px; }
.answer li { background: var(--paper); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; gap: 16px; animation: rowin .45s var(--ease) both; animation-delay: calc(var(--d) * 60ms); }
.answer li span { color: var(--muted); white-space: nowrap; font-size: var(--step-small); align-self: center; }
@keyframes rowin { from { opacity: 0; transform: translateY(10px); } }
.examples { grid-column: 8 / -1; align-self: end; margin-top: 48px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.examples button { color: var(--muted); transition: color .2s, transform .2s var(--ease); text-align: left; }
.examples button:hover { color: var(--ink); transform: translateX(4px); }
@media (max-width: 760px) {
  .typeline input { font-size: 11vw; }
  .answer, .examples { grid-column: 1 / -1; }
  .answer { margin-top: 28px; }
  .examples { flex-direction: row; flex-wrap: wrap; margin-top: 20px; }
  .examples button { background: var(--surface); color: var(--ink); min-height: 44px; padding: 0 16px; border-radius: 999px; }
}

/* ---------- names sentence ---------- */
.names { padding-top: var(--gap); }
.names { align-items: start; }
.names h2 { grid-column: 1 / span 4; font-size: var(--step-head); }
.names .sent { grid-column: 6 / -1; font-size: clamp(1.25rem, 2.2vw, 2.25rem); line-height: 1.2; letter-spacing: -0.03em; }
@media (max-width: 860px) { .names h2, .names .sent { grid-column: 1 / -1; } .names .sent { margin-top: 28px; } }
.names .n { color: #9aa0b0; transition: color .4s; }
.names .n.lit { color: var(--ink); }

/* ---------- progress showcase ---------- */
.prog { padding-top: var(--gap); align-items: start; }
.prog .say { grid-column: 1 / span 5; position: sticky; top: 120px; }
.prog .say p { margin-top: 28px; max-width: 40ch; }
.prog .ui-card { grid-column: 7 / -1; padding: clamp(24px, 3vw, 40px); }
.bigs { display: flex; gap: 48px; }
.bigs b { display: block; font-size: var(--step-head); font-weight: 500; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.areas { margin-top: 36px; display: grid; gap: 18px; }
.areas .top { display: flex; justify-content: space-between; gap: 12px; }
.areas .top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.track6 { height: 8px; border-radius: 99px; background: var(--paper); margin-top: 8px; overflow: hidden; }
.track6 > div { height: 100%; border-radius: 99px; background: var(--ink); width: 0; transition: width 1.4s var(--ease); transition-delay: calc(var(--d, 0) * 90ms); }
.hist { margin-top: 32px; display: grid; gap: 8px; }
.hist li { background: var(--paper); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hist li span { font-size: var(--step-small); color: var(--muted); }
@media (max-width: 860px) {
  .prog .say, .prog .ui-card { grid-column: 1 / -1; position: static; }
  .prog .ui-card { margin-top: 40px; }
}

/* ---------- close ---------- */
.close { margin-top: var(--gap); background: var(--ink); color: var(--paper); min-height: 90svh; display: grid; grid-template-rows: 1fr auto; padding: clamp(48px, 10vh, 120px) var(--margin) 40px; }
.close h2 { font-size: var(--step-display); font-weight: 600; line-height: .9; max-width: 9em; }
.close .row { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
.close .row p { font-size: var(--step-lead); max-width: 28ch; line-height: 1.3; }
@media (max-width: 760px) { .close h2 { font-size: 12.5vw; } .close .row .btn { width: 100%; } }

footer.foot { background: var(--field-1); color: var(--field-1-ink); overflow: hidden; padding: 64px var(--margin) 0; position: relative; }
.foot .inv { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); }
.foot .inv > div:first-child { grid-column: 1 / span 7; }
.foot .inv h2 { font-size: var(--step-head); }
.foot .inv .btn { margin-top: 28px; }
.foot .links { grid-column: 10 / -1; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.foot .links a, .foot .links button { color: #c9ccd4; transition: color .2s; }
.foot .links a:hover, .foot .links button:hover { color: #fff; }
.credits { margin-top: 96px; font-size: var(--step-small); color: #c9ccd4; max-width: 72ch; line-height: 1.5; }
.credits a { color: #fff; text-decoration: underline; text-underline-offset: .2em; }
.giant { font-size: 25vw; font-weight: 600; letter-spacing: -0.06em; line-height: .8; white-space: nowrap; margin-top: 32px; transform: translateY(22%); }
@media (max-width: 760px) {
  .foot .inv > div:first-child, .foot .links { grid-column: 1 / -1; }
  .foot .links { flex-direction: row; flex-wrap: wrap; margin-top: 40px; gap: 16px; }
  .giant { font-size: 34vw; }
}

/* ---------- app screens ---------- */
.app { max-width: 820px; margin: 0 auto; padding: clamp(40px, 8vh, 88px) var(--margin) 140px; }
.app h1 { font-size: var(--step-head); }
.note { color: var(--muted); }
.steprow { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
.steprow span { color: var(--muted); font-size: var(--step-small); white-space: nowrap; font-variant-numeric: tabular-nums; }
.steps { display: flex; gap: 6px; flex: 1; }
.steps i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); transition: background-color .4s; }
.steps i.on { background: var(--ink); }
.options { margin-top: 40px; display: grid; gap: 10px; }
.opt {
  width: 100%; text-align: left; background: var(--surface); border-radius: 16px; padding: 20px 22px;
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  transition: background-color .2s, transform .25s var(--ease);
}
.opt:hover { background: var(--surface-2); transform: translateX(4px); }
.opt:active { transform: scale(.98); }
.opt i { font-style: normal; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.chip { background: var(--surface); border-radius: 999px; padding: 0 20px; min-height: 46px; transition: background-color .2s, color .2s, transform .2s var(--ease); }
.chip:hover { background: var(--surface-2); }
.chip:active { transform: scale(.95); }
.chip.on { background: var(--ink); color: var(--paper); }
.panel { background: var(--surface); border-radius: var(--radius); padding: clamp(22px, 3vw, 36px); margin-top: 40px; }
.readout { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.readout b { font-size: var(--step-head); font-weight: 500; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.readout b small { font-size: .4em; color: var(--muted); letter-spacing: 0; }
.bump { animation: bump .25s var(--ease); }
@keyframes bump { 50% { transform: scale(1.08); } }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; background: transparent; margin-top: 18px; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: var(--surface-2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); margin-top: -11px; transition: transform .2s var(--ease); }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--surface-2); }
input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--ink); }
.scale { display: flex; justify-content: space-between; font-size: var(--step-small); color: var(--muted); margin-top: 6px; }
.panel .row, .app .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
textarea.box { width: 100%; background: var(--paper); border: 0; border-radius: 14px; padding: 16px 18px; outline: 3px solid transparent; margin-top: 12px; resize: vertical; min-height: 120px; transition: outline-color .2s; }
textarea.box:focus { outline-color: var(--ink); }
label.lab { display: block; font-weight: 500; }
.field-in { width: 100%; background: var(--surface); border: 0; border-radius: 14px; padding: 0 18px; height: 56px; margin-top: 10px; outline: 3px solid transparent; transition: outline-color .2s; }

// ---------- data from src/lib/categories.ts ----------
const CATEGORIES = [
  { key: "initiating", label: "Initiating with Strangers", column: "comfort_initiating" },
  { key: "depth", label: "Conversation Depth", column: "comfort_depth" },
  { key: "groups", label: "Group Dynamics & Meeting People", column: "comfort_groups" },
  { key: "speaking", label: "Public Speaking & Being Heard", column: "comfort_speaking" },
  { key: "assertiveness", label: "Assertiveness", column: "comfort_assertiveness" },
  { key: "visibility", label: "Visibility & Being Seen", column: "comfort_visibility" },
  { key: "solo", label: "Solo Social Presence", column: "comfort_solo" },
];
const CATEGORY_LABEL = Object.fromEntries(CATEGORIES.map(c => [c.key, c.label]));
const COMFORT_COLUMN = Object.fromEntries(CATEGORIES.map(c => [c.key, c.column]));
const GOALS = ["Make more friends","Speak up more at work or school","Feel comfortable alone in public","Get better at small talk","Say what I actually think","Be seen for my work"];
const HARDEST = ["Starting conversations","Silences in conversation","Being the centre of attention","Disagreeing with people","Walking into a room of strangers","Speaking in front of a group","Being alone in public"];
const SCENARIOS = [
  { category: "initiating", prompt: "You're in line at a coffee shop and the person next to you says something. How does it feel to keep it going?" },
  { category: "depth", prompt: "A friend asks how you're really doing, and the honest answer isn't 'fine'." },
  { category: "groups", prompt: "You arrive at a gathering where you know one person, and they're across the room." },
  { category: "speaking", prompt: "A meeting pauses and you have something worth saying to the whole room." },
  { category: "assertiveness", prompt: "Your order arrives wrong and you'd need to flag it to the server." },
  { category: "visibility", prompt: "Someone asks you to share something you made with a group of people." },
  { category: "solo", prompt: "You sit down to eat lunch alone at a busy restaurant, no phone." },
];
const ANSWER_OPTIONS = [
  { value: 0, label: "Easy — barely think about it" },
  { value: 1, label: "A little uneasy, but fine" },
  { value: 2, label: "Quite anxious" },
  { value: 3, label: "I'd avoid it" },
];
const answerToComfort = a => [8, 6, 4, 2][a] ?? 5;

// ---------- seed data from drizzle/migrations/0000_comfort_zone_core.sql ----------
const SEED = [
['Say thank you, warmly','Next time a cashier, barista or driver helps you, make eye contact and say thank you with genuine warmth. One line, that is all.','initiating',1,15,true],
['Make eye contact and smile','Make brief eye contact and smile at three people you pass today. No words needed.','initiating',1,15],
['Ask a stranger a simple question','Ask someone in public a low-stakes question: the time, where a shop is, whether a seat is free.','initiating',2,25],
['Comment on the shared moment','Make one light remark to a stranger about something you are both experiencing: the queue, the weather, the delayed train.','initiating',3,35],
['Give a genuine compliment','Offer one sincere compliment to a stranger about something they chose: a jacket, a bag, a book they are reading. Keep it respectful and move on gracefully.','initiating',4,45],
['Start and hold a short chat','Open a conversation with a stranger and keep it going for at least two exchanges before ending it warmly.','initiating',5,60],
['Ask one follow-up question','In any conversation today, ask one follow-up question instead of switching topics.','depth',1,15],
['Ask how something felt','Ask someone not just what happened, but how it felt for them.','depth',2,25],
['Share something small and true','Tell someone one honest thing about your day that you would normally keep to yourself.','depth',3,35],
['Name something you are working on','Tell a friend or colleague about something you find difficult or are trying to improve.','depth',4,45],
['Have a proper check-in','Ask someone you care about how they are really doing, and stay with the answer for a full conversation.','depth',5,60],
['Stay five minutes longer','In any group setting today, stay five minutes longer than you would normally.','groups',1,15],
['Say one thing in a group','Contribute at least one sentence in a group conversation of three or more people.','groups',2,25],
['Join a conversation already running','Walk up to a group conversation you were not part of and join it.','groups',3,35],
['Introduce two people','Introduce two people to each other and give each a sentence of context.','groups',4,45],
['Go to something new alone','Attend a meetup, class or event where you know nobody, and speak to at least two people.','groups',5,60],
['Speak up once in a meeting','Say one thing out loud in a meeting or class: a question, an agreement, an observation.','speaking',1,20],
['Ask a question in public','Ask a question in front of a group rather than waiting to ask privately afterwards.','speaking',2,25],
['Explain something to the room','Take one minute to explain an idea, update or recommendation to a group.','speaking',3,35],
['Volunteer to present','Offer to present or lead a section of a meeting, class or gathering.','speaking',4,50],
['Give a short talk','Deliver a five-minute prepared talk to a group.','speaking',5,65],
['Say no to something small','Decline one small request today that you would usually accept out of habit.','assertiveness',1,20],
['State a preference','When someone asks where to eat or what to do, give a real answer instead of "whatever you like".','assertiveness',2,25],
['Ask for what you need','Ask directly for something reasonable: a change to an order, a deadline shift, help with a task.','assertiveness',3,35],
['Disagree out loud, kindly','Voice a respectful disagreement in a conversation instead of staying quiet.','assertiveness',4,45],
['Raise something that bothered you','Calmly tell someone about a small thing that bothered you, using how it felt rather than blame.','assertiveness',5,60],
['Take the visible seat','Sit at the front, or in the middle of the room, rather than the edge.','visibility',1,15],
['Let a compliment land','When someone compliments you, say thank you and pause instead of deflecting.','visibility',2,25],
['Share something you made','Show a piece of your work, writing or a photo you took to at least one person.','visibility',3,35],
['Say what you are proud of','Tell someone about something you did well recently, without minimising it.','visibility',4,45],
['Post something in your own voice','Share a genuine thought, project or update publicly where people who know you will see it.','visibility',5,55],
['Sit somewhere without your phone','Sit in a cafe or park for ten minutes with your phone away. Just be there.','solo',1,15],
['Eat a meal alone in public','Have a meal or coffee alone at a table rather than takeaway.','solo',2,25],
['Take a slow walk somewhere busy','Spend twenty minutes walking somewhere busy without headphones, noticing people around you.','solo',3,30],
['Go to an event alone','Go to a film, exhibition or gig by yourself.','solo',4,45],
['Spend an afternoon out alone','Plan and spend a half-day out on your own in public places you enjoy.','solo',5,55],
];
const CHALLENGES = SEED.map(([title, description, category, tier, xp_value, cal], i) =>
  ({ id: "c" + i, title, description, category, tier, xp_value, is_calibration: !!cal }));
const byId = id => CHALLENGES.find(c => c.id === id) || null;
// each challenge → next-easier one in the same category (prefers a non-calibration one on ties)
function easierOf(c) {
  const lower = CHALLENGES.filter(x => x.category === c.category && x.tier < c.tier)
    .sort((a, b) => b.tier - a.tier || a.is_calibration - b.is_calibration);
  return lower[0] || null;
}

// ---------- local "database" (replaces Supabase) ----------
const KEY = "comfortzone-demo-v1";
function freshProfile() {
  const p = { onboarded: false, xp: 0, streak: 0, last_activity_date: null, goals: [], hardest: [],
    current_challenge_id: null, current_predicted_anxiety: null };
  CATEGORIES.forEach(c => p[c.column] = 5);
  return p;
}
let db = load();
function load() {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v) return v; } catch (e) {}
  return { session: null, profile: freshProfile(), history: [] };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

// ---------- logic ported from src/lib/comfort.functions.ts ----------
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const comfortToTier = c => clamp(Math.ceil(c / 2), 1, 5);

function pickChallenge(profile) {
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const recent = db.history.slice(0, 200);
  const blocked = new Set(recent.filter(r => r.created_at >= since).map(r => r.challenge_id));
  const recentCats = recent.slice(0, 3).map(r => byId(r.challenge_id)?.category).filter(Boolean);
  const pool = CHALLENGES.filter(c => !c.is_calibration);
  let best = null;
  for (const c of pool) {
    if (blocked.has(c.id)) continue;
    const gap = c.tier - comfortToTier(Number(profile[COMFORT_COLUMN[c.category]] ?? 5));
    if (gap < 0 || gap > 1) continue;
    let score = gap === 0 ? 10 : 8;
    const idx = recentCats.indexOf(c.category);
    if (idx === 0) score -= 6; else if (idx > 0) score -= 3;
    if (profile.goals?.length) score += 0.5;
    score += Math.random();
    if (!best || score > best.score) best = { c, score };
  }
  if (!best) return (pool.find(c => !blocked.has(c.id)) ?? pool[0])?.id ?? null;
  return best.c.id;
}

function getHome() {
  const p = db.profile;
  if (p.onboarded && !p.current_challenge_id) {
    p.current_challenge_id = pickChallenge(p); p.current_predicted_anxiety = null; save();
  }
  return { profile: p, challenge: p.onboarded ? byId(p.current_challenge_id) : null };
}

function saveOnboarding({ answers, goals, hardest }) {
  const p = db.profile;
  Object.assign(p, { onboarded: true, goals, hardest });
  CATEGORIES.forEach(c => { if (typeof answers[c.key] === "number") p[c.column] = answerToComfort(answers[c.key]); });
  save();
}

function adaptChallenge() {
  const cur = byId(db.profile.current_challenge_id);
  const e = cur && easierOf(cur);
  if (!e) return { ok: false };
  db.profile.current_challenge_id = e.id; save();
  return { ok: true };
}

const today = () => new Date().toISOString().slice(0, 10);
function nextStreak(p, awarded) {
  if (!awarded) return { streak: p.streak, date: p.last_activity_date ?? today() };
  if (p.last_activity_date === today()) return { streak: p.streak, date: today() };
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  return { streak: p.last_activity_date === y ? p.streak + 1 : 1, date: today() };
}

function submitOutcome({ outcome, predictedAnxiety, actualAnxiety, reflection, challengeId }, when) {
  const p = db.profile;
  const ch = byId(challengeId ?? p.current_challenge_id);
  if (!ch) throw new Error("No active challenge");
  const base = ch.xp_value;
  const xp = outcome === "completed" ? base : outcome === "adapted_completed" ? Math.round(base * .6)
    : outcome === "attempted" ? Math.round(base * .25) : 0;
  db.history.unshift({ id: "h" + Date.now() + Math.random(), challenge_id: ch.id, predicted_anxiety: predictedAnxiety,
    actual_anxiety: actualAnxiety, reflection_text: reflection || null, outcome, xp_awarded: xp,
    created_at: (when || new Date()).toISOString() });
  const col = COMFORT_COLUMN[ch.category];
  let delta = outcome === "completed" ? ((actualAnxiety ?? 10) <= 5 ? .5 : .15)
    : outcome === "adapted_completed" ? 0 : outcome === "attempted" ? -.25 : -.4;
  const nc = clamp(Number((Number(p[col] ?? 5) + delta).toFixed(2)), 1, 10);
  const { streak, date } = nextStreak(p, xp > 0);
  p[col] = nc;
  Object.assign(p, { xp: p.xp + xp, streak, last_activity_date: date, current_predicted_anxiety: null });
  p.current_challenge_id = pickChallenge(p);
  save();
  return { xpAwarded: xp };
}

// live thing: type a dread, get the area and three challenges
const KEYWORDS = {
  initiating: ["stranger", "small talk", "hello", "eye contact", "queue", "line", "barista", "cashier", "chat", "approach", "start"],
  depth: ["deep", "honest", "feeling", "open up", "friend", "check", "silence", "vulnerable", "share how", "real"],
  groups: ["group", "party", "room", "meetup", "event", "crowd", "new people", "gathering", "join", "networking", "walking into"],
  speaking: ["speak", "meeting", "present", "talk", "public", "class", "question", "lecture", "raise", "voice"],
  assertiveness: ["no", "disagree", "ask for", "complain", "order", "boundar", "preference", "conflict", "refund", "push back"],
  visibility: ["seen", "compliment", "post", "proud", "attention", "front", "show", "noticed", "work"],
  solo: ["alone", "solo", "eat", "lunch", "dinner", "cinema", "myself", "restaurant", "cafe", "café", "movie"],
};
function matchDread(text) {
  const t = " " + text.toLowerCase() + " ";
  let best = null, score = 0;
  for (const [cat, words] of Object.entries(KEYWORDS)) {
    const s = words.reduce((n, w) => n + (w.length <= 3 ? (new RegExp(`\\b${w}\\b`).test(t) ? 1 : 0) : (t.includes(w) ? 1 : 0)), 0);
    if (s > score) { score = s; best = cat; }
  }
  return best;
}
function renderAnswer() {
  const el = $("#answer"), inp = $("#dread"); if (!el || !inp) return;
  const cat = matchDread(inp.value);
  if (!cat) {
    el.innerHTML = `<div class="ui-card"><p class="ui-meta">No match yet</p><p class="ui-title">Try words like meetings, strangers, eating alone or saying no.</p></div>`;
    return;
  }
  const rows = CHALLENGES.filter(c => c.category === cat && !c.is_calibration && [1, 3, 5].includes(c.tier));
  el.innerHTML = `<div class="ui-card"><p class="ui-meta">That builds</p><p class="ui-title">${CATEGORY_LABEL[cat]}</p>
    <ul>${rows.map((c, i) => `<li style="--d:${i}">${c.title}<span>Tier ${c.tier} · ${c.xp_value} XP</span></li>`).join("")}</ul></div>`;
}

// ---------- motion ----------
function setupMotion() {
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target;
    el.classList.add("in");
    el.querySelectorAll?.("[data-w]").forEach(b => b.style.width = b.dataset.w + "%");
    if (el.dataset.count) countUp(el);
    el.querySelectorAll?.("[data-count]").forEach(countUp);
    io.unobserve(el);
  }), { threshold: 0.18, rootMargin: "0px 0px -6% 0px" });
  $$("[data-rise], [data-io], [data-count]").forEach(el => io.observe(el));
  cleanups.push(() => io.disconnect());

  // landing only
  const zoom = $(".zoom");
  if (!zoom) return;
  const bar = $("#lbar"), bandImgs = $$("#track .pic:not(.bars) img"), fields = $$(".field"), proofImg = $(".gapsec figure img");
  const card = $(".zoom-card"), pic = $(".zoom-pic");
  let lastY = scrollY, ticking = false;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function frame() {
    ticking = false;
    const vw = innerWidth, vh = innerHeight, y = scrollY;
    // bar hides on the way down, returns on the way up
    if (bar) bar.classList.toggle("hide", y > lastY && y > 400);
    lastY = y;
    if (!reduced) {
      // zoom: the queue opens from a window to the whole screen
      const r = zoom.getBoundingClientRect();
      const p = clamp(-r.top / (zoom.offsetHeight - vh), 0, 1);
      const e = ease(clamp(p / 0.62, 0, 1));
      const phone = vw < 760;
      pic.style.setProperty("--ix", ((phone ? 6 : 28) * (1 - e)).toFixed(2) + "%");
      pic.style.setProperty("--iy", ((phone ? 26 : 22) * (1 - e)).toFixed(2) + "%");
      pic.style.setProperty("--zs", (1.18 - .18 * e).toFixed(4));
      card.classList.toggle("on", p > .66);
      // the barista photo drifts inside its frame
      if (proofImg) {
        const pr = proofImg.parentElement.getBoundingClientRect();
        const q = clamp((vh - pr.top) / (vh + pr.height), 0, 1);
        proofImg.style.setProperty("--py", (-q * 13).toFixed(2) + "%");
      }
      // each photo in the band drifts inside its frame at its own pace
      bandImgs.forEach((img, k) => {
        const br = img.parentElement.getBoundingClientRect();
        if (br.bottom < 0 || br.top > vh) return;
        const q = clamp((vh - br.top) / (vh + br.height), 0, 1);
        img.style.setProperty("--py", (-q * (9 + k * 3)).toFixed(2) + "%");
      });
      // colour fields open from an inset window to full bleed as they arrive
      fields.forEach(f => {
        const fr = f.getBoundingClientRect();
        if (fr.bottom < 0 || fr.top > vh) return;
        const q = ease(clamp((vh - fr.top) / (vh * .7), 0, 1));
        f.style.setProperty("--cx", ((1 - q) * (vw < 760 ? 12 : 48)).toFixed(1) + "px");
        f.style.setProperty("--ci", ((1 - q) * 24).toFixed(1) + "px");
        f.style.setProperty("--cr", ((1 - q) * 28).toFixed(1) + "px");
      });
    } else card.classList.add("on");
  }
  const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } };
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", onScroll);
  frame();
  cleanups.push(() => { removeEventListener("scroll", onScroll); removeEventListener("resize", onScroll); });

  // lit name moves through the sentence
  const names = $$(".names .n"); let i = 0;
  const t = setInterval(() => { names[i].classList.remove("lit"); i = (i + 1) % names.length; names[i].classList.add("lit"); }, 2000);
  cleanups.push(() => clearInterval(t));
  renderAnswer();
}
function countUp(el) {
  const [a, b] = el.dataset.count.split(",").map(Number);
  if (reduced || a === b) { el.textContent = b; return; }
  const t0 = performance.now(), dur = 1400;
  (function step(t) {
    const k = clamp((t - t0) / dur, 0, 1), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(a + (b - a) * e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function bindLive() {
  const pred = $("#pred"), act = $("#act"), refl = $("#refl"), f = $("#authf"), dread = $("#dread");
  const bump = el => { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); };
  if (pred) pred.oninput = e => { td.predicted = +e.target.value; const o = $("#predv"); o.innerHTML = td.predicted + "<small>/10</small>"; bump(o); };
  if (act) act.oninput = e => { const v = +e.target.value; (route() === "onboarding" ? ob : td).actual = v; const o = $("#actv"); o.innerHTML = v + "<small>/10</small>"; bump(o); };
  if (refl) refl.oninput = e => { (route() === "onboarding" ? ob : td).reflection = e.target.value; };
  if (dread) dread.oninput = renderAnswer;
  if (f) f.onsubmit = e => {
    e.preventDefault();
    const email = $("#email").value.trim(), pw = $("#pw").value;
    if (!email || pw.length < 6) return toast("Enter an email and a password of at least 6 characters.", "err");
    db.session = { email }; save(); go("today");
  };
}

document.addEventListener("click", e => {
  const ex = e.target.closest("[data-ex]");
  if (ex) { const i = $("#dread"); i.value = ex.dataset.ex; renderAnswer(); i.focus(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case "signout": db.session = null; save(); go("auth"); break;
    case "sample": loadSample(); break;
    case "authmode": authMode = authMode === "signin" ? "signup" : "signin"; render(); break;
    case "answer": ob.answers[SCENARIOS[ob.step].category] = +v; ob.step++; render(); break;
    case "obback": ob.step--; render(); break;
    case "goal": toggle(ob.goals, v, 3); render(); break;
    case "hard": toggle(ob.hardest, v, 2); render(); break;
    case "obnext": ob.step++; render(); break;
    case "calib":
      saveOnboarding(ob);
      submitOutcome({ outcome: v, predictedAnxiety: null, actualAnxiety: v === "completed" ? ob.actual : null,
        reflection: ob.reflection, challengeId: CHALLENGES.find(c => c.is_calibration).id });
      ob = { step: 0, answers: {}, goals: [], hardest: [], reflection: "", actual: 5 };
      toast("Baseline saved. Here's your first challenge.");
      go("today"); break;
    case "lock": db.profile.current_predicted_anxiety = td.predicted; save(); td.phase = "doing"; render(); break;
    case "didit": td.phase = "reflect"; render(); break;
    case "adapt":
      if (adaptChallenge().ok) { td.adapted = true; toast("Swapped in a gentler version of the same skill."); }
      else toast("This is already the gentlest version of this skill.");
      render(); break;
    case "outcome": {
      const res = submitOutcome({ outcome: v === "completed" && td.adapted ? "adapted_completed" : v,
        predictedAnxiety: td.predicted, actualAnxiety: v === "skipped" ? null : td.actual, reflection: td.reflection });
      toast(res.xpAwarded > 0 ? `+${res.xpAwarded} XP` : "Noted. No penalty.");
      td = { phase: "predict", predicted: 5, actual: 5, reflection: "", adapted: false };
      render(); break;
    }
  }
});
function toggle(list, v, max) {
  const i = list.indexOf(v);
  if (i >= 0) list.splice(i, 1); else if (list.length < max) list.push(v);
}

  db = { session: { email: "sample@demo" }, profile: freshProfile(), history: [] };
  saveOnboarding({ answers: { initiating: 1, depth: 2, groups: 2, speaking: 3, assertiveness: 2, visibility: 1, solo: 1 },
    goals: ["Make more friends", "Speak up more at work or school"], hardest: ["Speaking in front of a group"] });
  const day = d => new Date(Date.now() - d * 864e5);
  const plan = [
    ["c0", "completed", null, 3, "The barista actually smiled back. Weirdly nice.", 12],
    ["c2", "completed", 6, 3, "Asked a guy at the station if this was the right platform. Took two seconds.", 6],
    ["c7", "completed", 5, 4, "Asked my sister how her new job actually felt. Long chat.", 5],
    ["c22", "completed", 7, 4, "Picked the restaurant for once. Nobody minded.", 4],
    ["c18", "attempted", 8, 7, "Started explaining, then let someone else finish. Next time.", 3],
    ["c27", "completed", 6, 3, "Said thanks and didn't deflect. Felt odd but fine.", 2],
    ["c33", "adapted_completed", 7, 4, "Did the easier version: coffee alone, no phone.", 1],
  ];
  for (const [id, outcome, pa, aa, txt, d] of plan) {
    db.profile.last_activity_date = new Date(day(d + 1)).toISOString().slice(0, 10);
    submitOutcome({ outcome, predictedAnxiety: pa, actualAnxiety: aa, reflection: txt, challengeId: id }, day(d));
  }
  db.profile.last_activity_date = day(1).toISOString().slice(0, 10);
  db.profile.streak = 6; save();
  td = { phase: "predict", predicted: 5, actual: 5, reflection: "", adapted: false };
  if (route() === "progress") render(); else go("progress");
  toast("Loaded a sample user with a week of history.");
}
$("#d-sample").onclick = loadSample;
$("#d-reset").onclick = () => {
  db = { session: null, profile: freshProfile(), history: [] }; save();
  ob = { step: 0, answers: {}, goals: [], hardest: [], reflection: "", actual: 5 };
  td = { phase: "predict", predicted: 5, actual: 5, reflection: "", adapted: false };
  if (route() === "") render(); else location.hash = "#/";
  toast("Demo reset.");
};

render();
</script>

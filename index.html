<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comfort Zone</title>
<meta name="description" content="Comfort Zone: one real-world social challenge a day, sized to how anxious you actually feel.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  // theme before first paint: saved choice, else the system's
  (function () { var t = "auto"; try { t = localStorage.getItem("cz-theme") || "auto"; } catch (e) {}
    var q = location.search.match(/theme=(light|dark)/); if (q) t = q[1];
    var dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    var w = "aurora"; try { w = localStorage.getItem("cz-wall") || "aurora"; } catch (e) {} var qw = location.search.match(/wall=(\w+)/); if (qw) w = qw[1]; document.documentElement.dataset.wall = w; })();
</script>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
  --spring: cubic-bezier(.34, 1.36, .64, 1);
  --smooth: cubic-bezier(.32, .72, 0, 1);
  --accent: #ff8a00;
  --accent-2: #ffad3d;
  --blue: #0a84ff;
  --mint: #2fd1ac;
  --r-xl: 32px; --r-l: 24px; --r-m: 18px;
}
:root[data-theme="light"] {
  --text: #1d1d1f;
  --text-2: rgba(29, 29, 31, .64);
  --text-3: rgba(29, 29, 31, .42);
  --glass: rgba(255, 255, 255, .5);
  --glass-hi: rgba(255, 255, 255, .78);
  --rim: rgba(255, 255, 255, .75);
  --rim-2: rgba(255, 255, 255, .15);
  --hair: rgba(0, 0, 0, .07);
  --fill: rgba(118, 118, 128, .12);
  --fill-2: rgba(118, 118, 128, .2);
  --shadow: 0 16px 50px rgba(30, 40, 90, .13), 0 2px 8px rgba(30, 40, 90, .06);
  --btn: #1d1d1f; --btn-text: #fff;


  --scrim: rgba(240, 242, 250, .35);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --text: #f5f5f7;
  --text-2: rgba(235, 235, 245, .66);
  --text-3: rgba(235, 235, 245, .4);
  --glass: rgba(26, 28, 42, .5);
  --glass-hi: rgba(64, 66, 88, .62);
  --rim: rgba(255, 255, 255, .22);
  --rim-2: rgba(255, 255, 255, .03);
  --hair: rgba(255, 255, 255, .09);
  --fill: rgba(118, 118, 128, .24);
  --fill-2: rgba(118, 118, 128, .36);
  --shadow: 0 20px 60px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
  --btn: #f5f5f7; --btn-text: #1d1d1f;


  --scrim: rgba(0, 0, 0, .3);
  color-scheme: dark;
}
/* wallpapers: each sets the ground and five light sources, per theme */
:root[data-theme="light"][data-wall="aurora"]   { --wall: #eef3fb; --b1: #8fd3ff; --b2: #f0abfc; --b3: #a7f3d0; --b4: #c4b5fd; --b5: #93c5fd; }
:root[data-theme="dark"][data-wall="aurora"]    { --wall: #03050c; --b1: #1d4ed8; --b2: #a21caf; --b3: #0e7490; --b4: #5b21b6; --b5: #047857; }
:root[data-theme="light"][data-wall="sunrise"]  { --wall: #f3f0f2; --b1: #ffb15e; --b2: #ff8db3; --b3: #7db7ff; --b4: #b7a3ff; --b5: #8ff0d2; }
:root[data-theme="dark"][data-wall="sunrise"]   { --wall: #07060a; --b1: #c2410c; --b2: #be185d; --b3: #1e40af; --b4: #6d28d9; --b5: #0f766e; }
:root[data-theme="light"][data-wall="ocean"]    { --wall: #eaf4fb; --b1: #7dd3fc; --b2: #a5b4fc; --b3: #5eead4; --b4: #60a5fa; --b5: #bae6fd; }
:root[data-theme="dark"][data-wall="ocean"]     { --wall: #020812; --b1: #0369a1; --b2: #3730a3; --b3: #0f766e; --b4: #1e3a8a; --b5: #155e75; }
:root[data-theme="light"][data-wall="graphite"] { --wall: #f2f2f5; --b1: #e4e4e7; --b2: #dbe3ee; --b3: #e7e5e4; --b4: #d4d4d8; --b5: #f4f4f5; }
:root[data-theme="dark"][data-wall="graphite"]  { --wall: #000000; --b1: #27272a; --b2: #1e293b; --b3: #292524; --b4: #3f3f46; --b5: #18181b; }
[data-theme="dark"] .wall i { opacity: .72; }
.walls { display: flex; gap: 10px; }
.sw { width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--hair); transition: transform .35s var(--spring), box-shadow .2s; }
.sw:hover { transform: scale(1.08); }
.sw.on { box-shadow: 0 0 0 2px var(--glass-hi), 0 0 0 4px var(--blue); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); color: var(--text); background: var(--wall); font-size: 16px; line-height: 1.42; letter-spacing: -0.011em; -webkit-font-smoothing: antialiased; overflow: hidden; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { list-style: none; padding: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; text-align: inherit; }
input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid rgba(10, 132, 255, .6); outline-offset: 2px; border-radius: 12px; }
.tnum { font-variant-numeric: tabular-nums; }
.t2 { color: var(--text-2); }
.t3 { color: var(--text-3); }

/* ---------- wallpaper ---------- */
.wall { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--wall); transition: background-color .6s; }
.wall i { position: absolute; width: 62vmax; height: 62vmax; border-radius: 50%; filter: blur(70px); opacity: .9; will-change: transform; transition: background-color .8s; }
.wall .w1 { background: var(--b1); left: -14vmax; top: -18vmax; animation: d1 26s ease-in-out infinite alternate; }
.wall .w2 { background: var(--b2); right: -18vmax; top: -10vmax; animation: d2 30s ease-in-out infinite alternate; }
.wall .w3 { background: var(--b3); left: 20vmax; bottom: -28vmax; animation: d3 34s ease-in-out infinite alternate; }
.wall .w4 { background: var(--b4); right: -10vmax; bottom: -20vmax; width: 46vmax; height: 46vmax; animation: d1 28s ease-in-out infinite alternate-reverse; }
.wall .w5 { background: var(--b5); left: -10vmax; bottom: -10vmax; width: 40vmax; height: 40vmax; opacity: .7; animation: d2 24s ease-in-out infinite alternate-reverse; }
@keyframes d1 { to { transform: translate(14vmax, 10vmax) scale(1.12); } }
@keyframes d2 { to { transform: translate(-12vmax, 14vmax) scale(.9); } }
@keyframes d3 { to { transform: translate(10vmax, -12vmax) scale(1.08); } }

/* ---------- glass material ---------- */
.glass {
  position: relative; background: var(--glass); border-radius: var(--r-l);
  -webkit-backdrop-filter: blur(30px) saturate(190%); backdrop-filter: blur(30px) saturate(190%);
  box-shadow: var(--shadow), inset 0 1px 0 var(--rim), inset 0 -1px 0 var(--rim-2);
}
/* the liquid rim: a bright edge that fades round the shape */
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(150deg, var(--rim), transparent 38%, transparent 62%, var(--rim));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
/* specular light that follows the pointer */
.sheen::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .28), transparent 45%);
}
.sheen:hover::after { opacity: 1; }
[data-theme="dark"] .sheen::after { background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .1), transparent 45%); }

/* ---------- shell ---------- */
.sidebar { position: fixed; z-index: 20; left: 16px; top: 16px; bottom: 16px; width: 264px; padding: 22px 14px 14px; display: flex; flex-direction: column; border-radius: var(--r-xl); transition: transform .6s var(--smooth), opacity .4s; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 22px; }
.brand img { width: 40px; height: 40px; border-radius: 10px; box-shadow: 0 4px 14px rgba(31, 43, 77, .3); }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; display: block; }
.brand span { font-size: 13px; color: var(--text-2); }
.navlist { display: grid; gap: 4px; }
.navlist a { position: relative; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 14px; font-weight: 500; font-size: 15px; color: var(--text-2); transition: color .2s, background-color .2s; }
.navlist a svg { width: 22px; height: 22px; flex: none; }
.navlist a:hover { background: var(--fill); color: var(--text); }
.navlist a.on { color: var(--text); background: var(--glass-hi); box-shadow: 0 4px 14px rgba(30, 40, 90, .08), inset 0 1px 0 var(--rim); }
.navlist a .count { margin-left: auto; font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.sidefoot { margin-top: auto; display: grid; gap: 8px; }
.mini { padding: 14px; border-radius: var(--r-m); background: var(--fill); }
.mini b { font-weight: 600; font-size: 14px; display: block; }
.mini p { font-size: 13px; color: var(--text-2); margin-top: 4px; }
.mini .row2 { display: flex; gap: 6px; margin-top: 10px; }

.view { position: fixed; inset: 0; z-index: 10; overflow-y: auto; overflow-x: hidden; padding: 28px 40px 120px 320px; scrollbar-width: thin; }
.page { max-width: 1080px; margin: 0 auto; }
.app.bare .sidebar { transform: translateX(-120%); opacity: 0; pointer-events: none; }
.app.bare .view { padding: 24px; display: grid; place-items: center; }
.app.bare .tabbar { transform: translate(-50%, 160%); }

.tabbar { position: fixed; z-index: 20; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(420px, calc(100% - 28px)); height: 66px; padding: 6px; border-radius: 33px; display: none; grid-template-columns: repeat(4, 1fr); transition: transform .6s var(--smooth); }
.tabbar .ind { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 4); border-radius: 27px; background: var(--glass-hi); box-shadow: 0 4px 14px rgba(30, 40, 90, .1), inset 0 1px 0 var(--rim); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .55s var(--spring); }
.tabbar a { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--text-2); transition: color .2s; }
.tabbar a svg { width: 24px; height: 24px; transition: transform .4s var(--spring); }
.tabbar a.on { color: var(--text); }
.tabbar a:active svg { transform: scale(.82); }

@media (max-width: 920px) {
  .sidebar { display: none; }
  .tabbar { display: grid; }
  .view { padding: 16px 16px calc(110px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- toolbar + titles ---------- */
.toolbar { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; gap: 8px; min-height: 52px; margin: 0 -10px 4px; padding: 6px 10px; border-radius: 26px; transition: background-color .3s, box-shadow .3s; }
.toolbar.solid { background: var(--glass); -webkit-backdrop-filter: blur(30px) saturate(190%); backdrop-filter: blur(30px) saturate(190%); box-shadow: var(--shadow), inset 0 1px 0 var(--rim); }
.toolbar .tt { font-weight: 600; font-size: 17px; opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .3s var(--smooth); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; }
.toolbar.solid .tt { opacity: 1; transform: none; }
.back { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 14px 0 8px; border-radius: 20px; font-weight: 500; color: var(--blue); background: var(--fill); transition: background-color .2s, transform .3s var(--spring); flex: none; }
.back:active { transform: scale(.94); }
.back svg { width: 20px; height: 20px; }
.large { font-size: clamp(34px, 3.4vw, 44px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; }
.lede { font-size: 17px; color: var(--text-2); margin-top: 8px; max-width: 56ch; }
.sec { margin-top: 34px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 4px 12px; }
.sec-h h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; }
.sec-h a, .sec-h span { font-size: 15px; color: var(--text-2); white-space: nowrap; }
.sec-h a { color: var(--blue); }

.rise { animation: rise .8s var(--smooth) both; animation-delay: calc(var(--d, 0) * 60ms + 40ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); filter: blur(6px); } }

/* ---------- controls ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 24px; border-radius: 25px; font-weight: 600; font-size: 16px; letter-spacing: -0.015em; white-space: nowrap; transition: transform .35s var(--spring), opacity .2s, background-color .2s, box-shadow .3s; }
.btn:active { transform: scale(.95); }
.btn.primary { background: var(--btn); color: var(--btn-text); box-shadow: 0 8px 24px rgba(0, 0, 0, .16); }
.btn.accent { background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: #fff; box-shadow: 0 10px 26px rgba(255, 138, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .45); }
.btn.accent:hover { box-shadow: 0 14px 32px rgba(255, 138, 0, .48), inset 0 1px 0 rgba(255, 255, 255, .45); }
.btn.glassy { background: var(--fill); box-shadow: inset 0 1px 0 var(--rim); }
.btn.glassy:hover { background: var(--fill-2); }
.btn.link { height: 44px; padding: 0 12px; color: var(--blue); font-weight: 500; }
.btn.quiet { height: 44px; padding: 0 12px; color: var(--text-2); font-weight: 500; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.btns.col { flex-direction: column; }
.btns.col .btn { width: 100%; }

.chip { flex: none; height: 38px; padding: 0 16px; border-radius: 19px; font-size: 15px; font-weight: 500; background: var(--fill); transition: background-color .2s, color .2s, transform .3s var(--spring), box-shadow .3s; }
.chip:hover { background: var(--fill-2); }
.chip:active { transform: scale(.93); }
.chip.on { background: var(--btn); color: var(--btn-text); box-shadow: 0 6px 16px rgba(0, 0, 0, .15); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.x { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 4px 16px 8px; }
.chips.x::-webkit-scrollbar { display: none; }

.badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 13px; font-size: 13px; font-weight: 600; background: var(--fill); color: var(--text-2); white-space: nowrap; }
.badge.or { background: rgba(255, 138, 0, .16); color: #b85600; }
.badge.bl { background: rgba(10, 132, 255, .14); color: #0a5fb8; }
.badge.mn { background: rgba(47, 209, 172, .18); color: #0a7059; }
[data-theme="dark"] .badge.or { color: #ffb15e; }
[data-theme="dark"] .badge.bl { color: #7ab8ff; }
[data-theme="dark"] .badge.mn { color: #7aeacf; }
[data-theme="dark"] { --blue: #4da3ff; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }

.field { display: block; margin-top: 14px; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 4px 6px; }
.input { width: 100%; height: 52px; padding: 0 16px; border: 0; border-radius: 16px; background: var(--fill); outline: 2px solid transparent; transition: outline-color .2s, background-color .2s; font-size: 17px; }
.input:focus { outline-color: var(--blue); background: var(--glass-hi); }
textarea.input { height: auto; min-height: 96px; padding: 14px 16px; resize: none; line-height: 1.4; }
.hint { font-size: 13px; color: var(--text-2); margin: 8px 4px 0; }

/* the anxiety meter */
.meter { margin-top: 22px; }
.meter .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.meter label { font-weight: 600; font-size: 15px; max-width: 24ch; }
.meter .num { font-size: 64px; font-weight: 300; letter-spacing: -0.05em; line-height: .85; font-variant-numeric: tabular-nums; }
.meter .num small { font-size: 18px; font-weight: 500; color: var(--text-3); letter-spacing: 0; }
.meter .word { text-align: right; font-size: 14px; font-weight: 500; color: var(--text-2); margin-top: 6px; min-height: 20px; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin-top: 6px; cursor: pointer; --p: 44%; }
.range::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--accent-2), var(--accent)) 0 / var(--p) 100% no-repeat, var(--fill-2); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -10px; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(0, 0, 0, .22), 0 0 0 .5px rgba(0, 0, 0, .06); transition: transform .3s var(--spring); }
.range:active::-webkit-slider-thumb { transform: scale(1.18); }
.range::-moz-range-track { height: 10px; border-radius: 5px; background: var(--fill-2); }
.range::-moz-range-progress { height: 10px; border-radius: 5px; background: var(--accent); }
.range::-moz-range-thumb { width: 30px; height: 30px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(0, 0, 0, .22); }
.scale { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--text-3); margin-top: 2px; }
.bump { animation: bump .35s var(--spring); }
@keyframes bump { 40% { transform: scale(1.1); } }

/* ---------- lists (inset grouped) ---------- */
.list { border-radius: var(--r-l); overflow: hidden; }
.list > .it { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 18px; position: relative; transition: background-color .2s; }
.list > .it + .it::before { content: ""; position: absolute; top: 0; left: 18px; right: 0; height: 1px; background: var(--hair); }
.list > a.it:hover, .list > button.it:hover { background: var(--fill); }
.list > button.it { width: 100%; text-align: left; }
.it .main { flex: 1; min-width: 0; }
.it .main b { display: block; font-weight: 500; font-size: 16px; line-height: 1.3; }
.it .main span { display: block; font-size: 13px; color: var(--text-2); margin-top: 2px; }
.it .end { font-size: 15px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.it .end b { color: var(--text); font-weight: 600; }
.it .chev { width: 14px; height: 14px; color: var(--text-3); flex: none; }
.sq { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; color: #fff; }
.sq svg { width: 18px; height: 18px; }

/* ---------- rings ---------- */
.rings { position: relative; width: 176px; height: 176px; flex: none; }
.rings svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.rings circle { fill: none; stroke-linecap: round; }
.rings .tr { opacity: .2; }
.rings .pr { stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 1.6s var(--smooth); filter: drop-shadow(0 0 6px currentColor); }
.ringcard { display: flex; align-items: center; gap: 26px; padding: 24px; }
@media (max-width: 420px) { .ringcard { gap: 18px; padding: 20px; } .ringcard .rings { width: 140px; height: 140px; } }
.legend { display: grid; gap: 14px; flex: 1; min-width: 0; }
.legend li { display: grid; gap: 1px; }
.legend .k { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.legend .k i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.legend .v { font-size: 26px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.legend .v small { font-size: 14px; font-weight: 500; color: var(--text-3); letter-spacing: 0; margin-left: 3px; }
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.minicard { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.minicard .rings { width: 64px; height: 64px; }
.minicard b { font-size: 15px; font-weight: 600; line-height: 1.25; }
.minicard .v { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.minicard .tier { font-size: 13px; color: var(--text-2); }

/* ---------- today ---------- */
.today { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; margin-top: 26px; align-items: start; }
.today .col { display: grid; gap: 20px; }
@media (max-width: 1180px) { .today { grid-template-columns: minmax(0, 1fr); } }
.greet { font-size: clamp(32px, 3.2vw, 44px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.08; max-width: 22ch; }
.greet span { color: var(--text-2); }
.chal { padding: 28px; overflow: hidden; }
@media (max-width: 420px) { .chal { padding: 22px; } }

<script>
// ---------- data from src/lib/categories.ts ----------
const CATEGORIES = [
  { key: "initiating", label: "Initiating with Strangers", short: "Strangers", column: "comfort_initiating" },
  { key: "depth", label: "Conversation Depth", short: "Depth", column: "comfort_depth" },
  { key: "groups", label: "Group Dynamics & Meeting People", short: "Groups", column: "comfort_groups" },
  { key: "speaking", label: "Public Speaking & Being Heard", short: "Speaking", column: "comfort_speaking" },
  { key: "assertiveness", label: "Assertiveness", short: "Assertiveness", column: "comfort_assertiveness" },
  { key: "visibility", label: "Visibility & Being Seen", short: "Visibility", column: "comfort_visibility" },
  { key: "solo", label: "Solo Social Presence", short: "Solo", column: "comfort_solo" },
];
const CATEGORY_LABEL = Object.fromEntries(CATEGORIES.map(c => [c.key, c.label]));
const COMFORT_COLUMN = Object.fromEntries(CATEGORIES.map(c => [c.key, c.column]));
const shortOf = key => CATEGORIES.find(c => c.key === key).short;
const GOALS = ["Make more friends","Speak up more at work or school","Feel comfortable alone in public","Get better at small talk","Say what I actually think","Be seen for my work"];
const HARDEST = ["Starting conversations","Silences in conversation","Being the centre of attention","Disagreeing with people","Walking into a room of strangers","Speaking in front of a group","Being alone in public"];
const SCENARIOS = [
  { category: "initiating", prompt: "You're in line at a coffee shop and the person next to you says something. How does it feel to keep it going?" },
  { category: "depth", prompt: "A friend asks how you're really doing, and the honest answer isn't 'fine'." },
  { category: "groups", prompt: "You arrive at a gathering where you know one person, and they're across the room." },
  { category: "speaking", prompt: "A meeting pauses and you have something worth saying to the whole room." },
  { category: "assertiveness", prompt: "Your order arrives wrong and you'd need to flag it to the server." },
  { category: "visibility", prompt: "Someone asks you to share something you made with a group of people." },
  { category: "solo", prompt: "You sit down to eat lunch alone at a busy restaurant, no phone." },
];
const ANSWER_OPTIONS = [
  { value: 0, label: "Easy, barely think about it" },
  { value: 1, label: "A little uneasy, but fine" },
  { value: 2, label: "Quite anxious" },
  { value: 3, label: "I'd avoid it" },
];
const answerToComfort = a => [8, 6, 4, 2][a] ?? 5;
const FEEL = ["", "Totally calm", "Calm", "Barely there", "A flutter", "Noticeable", "Nervous", "Very nervous", "Heart racing", "Dreading it", "As bad as it gets"];

// ---------- seed data from drizzle/migrations/0000_comfort_zone_core.sql ----------
const SEED = [
['Say thank you, warmly','Next time a cashier, barista or driver helps you, make eye contact and say thank you with genuine warmth. One line, that is all.','initiating',1,15,true],
['Make eye contact and smile','Make brief eye contact and smile at three people you pass today. No words needed.','initiating',1,15],
['Ask a stranger a simple question','Ask someone in public a low-stakes question: the time, where a shop is, whether a seat is free.','initiating',2,25],
['Comment on the shared moment','Make one light remark to a stranger about something you are both experiencing: the queue, the weather, the delayed train.','initiating',3,35],
['Give a genuine compliment','Offer one sincere compliment to a stranger about something they chose: a jacket, a bag, a book they are reading. Keep it respectful and move on gracefully.','initiating',4,45],
['Start and hold a short chat','Open a conversation with a stranger and keep it going for at least two exchanges before ending it warmly.','initiating',5,60],
['Ask one follow-up question','In any conversation today, ask one follow-up question instead of switching topics.','depth',1,15],
['Ask how something felt','Ask someone not just what happened, but how it felt for them.','depth',2,25],
['Share something small and true','Tell someone one honest thing about your day that you would normally keep to yourself.','depth',3,35],
['Name something you are working on','Tell a friend or colleague about something you find difficult or are trying to improve.','depth',4,45],
['Have a proper check-in','Ask someone you care about how they are really doing, and stay with the answer for a full conversation.','depth',5,60],
['Stay five minutes longer','In any group setting today, stay five minutes longer than you would normally.','groups',1,15],
['Say one thing in a group','Contribute at least one sentence in a group conversation of three or more people.','groups',2,25],
['Join a conversation already running','Walk up to a group conversation you were not part of and join it.','groups',3,35],
['Introduce two people','Introduce two people to each other and give each a sentence of context.','groups',4,45],
['Go to something new alone','Attend a meetup, class or event where you know nobody, and speak to at least two people.','groups',5,60],
['Speak up once in a meeting','Say one thing out loud in a meeting or class: a question, an agreement, an observation.','speaking',1,20],
['Ask a question in public','Ask a question in front of a group rather than waiting to ask privately afterwards.','speaking',2,25],
['Explain something to the room','Take one minute to explain an idea, update or recommendation to a group.','speaking',3,35],
['Volunteer to present','Offer to present or lead a section of a meeting, class or gathering.','speaking',4,50],
['Give a short talk','Deliver a five-minute prepared talk to a group.','speaking',5,65],
['Say no to something small','Decline one small request today that you would usually accept out of habit.','assertiveness',1,20],
['State a preference','When someone asks where to eat or what to do, give a real answer instead of "whatever you like".','assertiveness',2,25],
['Ask for what you need','Ask directly for something reasonable: a change to an order, a deadline shift, help with a task.','assertiveness',3,35],
['Disagree out loud, kindly','Voice a respectful disagreement in a conversation instead of staying quiet.','assertiveness',4,45],
['Raise something that bothered you','Calmly tell someone about a small thing that bothered you, using how it felt rather than blame.','assertiveness',5,60],
['Take the visible seat','Sit at the front, or in the middle of the room, rather than the edge.','visibility',1,15],
['Let a compliment land','When someone compliments you, say thank you and pause instead of deflecting.','visibility',2,25],
['Share something you made','Show a piece of your work, writing or a photo you took to at least one person.','visibility',3,35],
['Say what you are proud of','Tell someone about something you did well recently, without minimising it.','visibility',4,45],
['Post something in your own voice','Share a genuine thought, project or update publicly where people who know you will see it.','visibility',5,55],
['Sit somewhere without your phone','Sit in a cafe or park for ten minutes with your phone away. Just be there.','solo',1,15],
['Eat a meal alone in public','Have a meal or coffee alone at a table rather than takeaway.','solo',2,25],
['Take a slow walk somewhere busy','Spend twenty minutes walking somewhere busy without headphones, noticing people around you.','solo',3,30],
['Go to an event alone','Go to a film, exhibition or gig by yourself.','solo',4,45],
['Spend an afternoon out alone','Plan and spend a half-day out on your own in public places you enjoy.','solo',5,55],
];
const CHALLENGES = SEED.map(([title, description, category, tier, xp_value, cal], i) =>
  ({ id: "c" + i, title, description, category, tier, xp_value, is_calibration: !!cal }));
const byId = id => CHALLENGES.find(c => c.id === id) || null;
function easierOf(c) {
  const lower = CHALLENGES.filter(x => x.category === c.category && x.tier < c.tier)
    .sort((a, b) => b.tier - a.tier || a.is_calibration - b.is_calibration);
  return lower[0] || null;
}

// ---------- local "database" (stands in for Supabase) ----------
const KEY = "comfortzone-demo-v1";
function freshProfile() {
  const p = { onboarded: false, display_name: null, xp: 0, streak: 0, last_activity_date: null, goals: [], hardest: [],
    current_challenge_id: null, current_predicted_anxiety: null };
  CATEGORIES.forEach(c => p[c.column] = 5);
  return p;
}
let db = load();
function load() {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.profile) return v; } catch (e) {}
  return { session: null, profile: freshProfile(), history: [] };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

// ---------- logic ported from src/lib/comfort.functions.ts ----------
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const comfortToTier = c => clamp(Math.ceil(c / 2), 1, 5);
const level = (p, cat) => Number(p[COMFORT_COLUMN[cat]] ?? 5);

function pickChallenge(profile) {
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const recent = db.history.slice(0, 200);
  const blocked = new Set(recent.filter(r => r.created_at >= since).map(r => r.challenge_id));
  const recentCats = recent.slice(0, 3).map(r => byId(r.challenge_id)?.category).filter(Boolean);
  const pool = CHALLENGES.filter(c => !c.is_calibration);
  let best = null;
  for (const c of pool) {
    if (blocked.has(c.id)) continue;
    const gap = c.tier - comfortToTier(level(profile, c.category));
    if (gap < 0 || gap > 1) continue;
    let score = gap === 0 ? 10 : 8;
    const idx = recentCats.indexOf(c.category);
    if (idx === 0) score -= 6; else if (idx > 0) score -= 3;
    if (profile.goals?.length) score += 0.5;
    score += Math.random();
    if (!best || score > best.score) best = { c, score };

  return best.c.id;
}
function getHome() {
  const p = db.profile;
  if (p.onboarded && !p.current_challenge_id) { p.current_challenge_id = pickChallenge(p); p.current_predicted_anxiety = null; save(); }
  return { profile: p, challenge: p.onboarded ? byId(p.current_challenge_id) : null };
}
function saveOnboarding({ answers, goals, hardest }) {
  const p = db.profile;
  Object.assign(p, { onboarded: true, goals, hardest });
  CATEGORIES.forEach(c => { if (typeof answers[c.key] === "number") p[c.column] = answerToComfort(answers[c.key]); });
  save();
}
function adaptChallenge() {
  const cur = byId(db.profile.current_challenge_id);
  const e = cur && easierOf(cur);
  if (!e) return { ok: false };
  db.profile.current_challenge_id = e.id; save();
  return { ok: true, easier: e };
}
const isoDay = d => d.toISOString().slice(0, 10);
function nextStreak(p, awarded) {
  const today = isoDay(new Date());
  if (!awarded) return { streak: p.streak, date: p.last_activity_date ?? today };
  if (p.last_activity_date === today) return { streak: p.streak, date: today };
  const y = isoDay(new Date(Date.now() - 864e5));
  return { streak: p.last_activity_date === y ? p.streak + 1 : 1, date: today };
}
function submitOutcome({ outcome, predictedAnxiety, actualAnxiety, reflection, challengeId }, when) {
  const p = db.profile;
  const ch = byId(challengeId ?? p.current_challenge_id);
  if (!ch) throw new Error("No active challenge");
  const base = ch.xp_value;
  const xp = outcome === "completed" ? base : outcome === "adapted_completed" ? Math.round(base * .6)
    : outcome === "attempted" ? Math.round(base * .25) : 0;
  db.history.unshift({ id: "h" + Date.now() + Math.random(), challenge_id: ch.id, predicted_anxiety: predictedAnxiety,
    actual_anxiety: actualAnxiety, reflection_text: reflection || null, outcome, xp_awarded: xp,
    created_at: (when || new Date()).toISOString() });
  const col = COMFORT_COLUMN[ch.category];
  const before = Number(p[col] ?? 5);
  const delta = outcome === "completed" ? ((actualAnxiety ?? 10) <= 5 ? .5 : .15)
    : outcome === "adapted_completed" ? 0 : outcome === "attempted" ? -.25 : -.4;
  const nc = clamp(Number((before + delta).toFixed(2)), 1, 10);
  const { streak, date } = nextStreak(p, xp > 0);
  p[col] = nc;
  Object.assign(p, { xp: p.xp + xp, streak, last_activity_date: date, current_predicted_anxiety: null });
  p.current_challenge_id = pickChallenge(p);
  save();
  return { xpAwarded: xp, challenge: ch, before, after: nc };
}

const WEEK_GOAL = 5;
function stats() {
  const h = db.history, p = db.profile;
  const done = h.filter(r => r.outcome === "completed" || r.outcome === "adapted_completed").length;
  const both = h.filter(r => r.predicted_anxiety && r.actual_anxiety);
  const calmer = both.filter(r => r.actual_anxiety < r.predicted_anxiety).length;
  const gap = both.length ? both.reduce((s, r) => s + (r.predicted_anxiety - r.actual_anxiety), 0) / both.length : 0;
  const week = h.filter(r => r.xp_awarded > 0 && Date.now() - new Date(r.created_at) < 7 * 864e5).length;
  const avg = CATEGORIES.reduce((s, c) => s + level(p, c.key), 0) / CATEGORIES.length;
  console.assert(h.reduce((s, r) => s + r.xp_awarded, 0) === p.xp, "XP total does not match history");
  return { done, both: both.length, calmer, gap, week, avg };
}

// ---------- router + transitions ----------
const TABS = [["today", "Today"], ["progress", "Progress"], ["challenges", "Challenges"], ["you", "You"]];
$("#navlist").innerHTML = TABS.map(([k, l]) => `<a href="#/${k}" data-tab="${k}">${ICON[k]}${l}<span class="count" data-count-for="${k}"></span></a>`).join("");
$("#tabbar").insertAdjacentHTML("beforeend", TABS.map(([k, l]) => `<a href="#/${k}" data-tab="${k}">${ICON[k]}${l}</a>`).join(""));

let current = null, swapping = null;
const route = () => location.hash.replace(/^#\/?/, "") || "";
function resolve(r) {
  if (!db.session || r === "welcome") return Welcome();
  if (!db.profile.onboarded || r === "onboarding") return Onboarding();
  if (r === "progress") return Progress();
  if (r === "challenges") return Challenges();
  if (r.startsWith("challenges/")) return Detail(r.split("/")[1]);
  if (r === "you") return You();
  return Today();
}
function go(r) { if (route() === r) render(); else location.hash = "#/" + r; }
function chrome(scr) {
  $("#app").classList.toggle("bare", !!scr.bare);
  $$("[data-tab]").forEach(a => { const on = a.dataset.tab === scr.tab; a.classList.toggle("on", on); on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });
  const i = TABS.findIndex(t => t[0] === scr.tab);
  if (i >= 0) $(".tabbar .ind").style.setProperty("--i", i);
  $("#sideName").textContent = db.session ? nameOf(db.profile) : "One step at a time";
  const fits = db.profile.onboarded ? CHALLENGES.filter(c => !c.is_calibration && [0, 1].includes(c.tier - comfortToTier(level(db.profile, c.category)))).length : 0;
  $('[data-count-for="challenges"]').textContent = fits ? fits + " fit" : "";
}
function render(opts = {}) {
  const scr = resolve(route());
  const view = $("#view");
  const key = scr.key || scr.tab || "x";
  chrome(scr);
  const old = $(".page", view);
  const make = () => {
    const el = document.createElement("div");
    el.className = "page"; el.dataset.key = key; el.innerHTML = scr.html;
    return el;
  };
  // the same screen re-rendering in place keeps its scroll and skips the entrances
  if (old && old.dataset.key === key && opts.inPlace) {
    const top = view.scrollTop, el = make();
    $$(".rise, .seg, .dumb .a", el).forEach(n => n.style.animation = "none");
    old.replaceWith(el); view.scrollTop = top; mount(el, true); current = scr; return;
  }
  const dir = !current ? 0 : scr.depth > current.depth ? 1 : scr.depth < current.depth ? -1 : 0;
  current = scr;
  const enter = () => {
    $(".page", view)?.remove();
    const el = make(); view.appendChild(el); view.scrollTop = 0; mount(el);
    if (!reduced && old) el.animate([{ opacity: 0, transform: `translateX(${dir * 40}px) scale(${dir ? 1 : .985})`, filter: "blur(8px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: 560, easing: "cubic-bezier(.32,.72,0,1)" });
  };
  if (!old || reduced || opts.instant) { enter(); return; }
  clearTimeout(swapping);
  old.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${-dir * 30}px) scale(${dir ? 1 : .985})` }], { duration: 170, easing: "ease-in", fill: "forwards" });
  swapping = setTimeout(enter, 160);
}
const rerender = () => render({ inPlace: true });
addEventListener("hashchange", () => { closeSheet(); render(); });

function mount(el, inPlace) {
  const view = $("#view"), tb = $(".toolbar", el);
  view.onscroll = () => tb && tb.classList.toggle("solid", view.scrollTop > 40);
  view.onscroll();
  bindMeter(el, "pred", v => td.pred = v);
  // rings fill after the entrance
  requestAnimationFrame(() => requestAnimationFrame(() => $$(".pr", el).forEach((c, i) => {
    if (inPlace || reduced) c.style.transition = "none";
    setTimeout(() => c.style.strokeDashoffset = 100 - c.dataset.pct, inPlace || reduced ? 0 : 250 + i * 90);
  })));
  if (!inPlace) $$("[data-count]", el).forEach(n => countTo(n, 0));
}
function countTo(n, from) {
  const to = +n.dataset.count, a = from || 0;
  if (reduced || a === to) { n.textContent = to; return; }
  const t0 = performance.now(), dur = 1000;
  (function f(t) { const k = clamp((t - t0) / dur, 0, 1), e = 1 - Math.pow(1 - k, 3); n.textContent = Math.round(a + (to - a) * e); if (k < 1) requestAnimationFrame(f); })(t0);
}
// specular light follows the pointer across glass
document.addEventListener("pointermove", e => {
  const g = e.target.closest?.(".sheen"); if (!g) return;
  const r = g.getBoundingClientRect();
  g.style.setProperty("--mx", e.clientX - r.left + "px"); g.style.setProperty("--my", e.clientY - r.top + "px");

// ---------- actions ----------
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const v = b.dataset.v, p = db.profile;
  switch (b.dataset.act) {
    case "signup": authSheet("signup"); break;

    case "obback": ob.step--; render(); break;
    case "goal": toggle(ob.goals, v, 3); rerender(); break;
    case "hard": toggle(ob.hardest, v, 2); rerender(); break;
    case "obnext": ob.step++; render(); break;
    case "calibskip":
      saveOnboarding(ob);
      submitOutcome({ outcome: "skipped", predictedAnxiety: null, actualAnxiety: null, challengeId: "c0" });
      ob = { step: 0, answers: {}, goals: [], hardest: [] };
      toast("Baseline saved"); go("today"); break;
    case "calibdone": calibrationSheet(); break;
    case "lock": p.current_predicted_anxiety = td.pred || 5; save(); navigator.vibrate?.(10); rerender(); toast(`Locked in at ${p.current_predicted_anxiety}/10`); break;
    case "didit": reflectSheet("completed"); break;

    case "adapt": { const r = adaptChallenge(); if (r.ok) { td.adapted = true; toast("Swapped in a gentler version"); rerender(); } else toast("Already the gentlest one"); break; }
    case "skip":

      td = { adapted: false, pred: 5 }; toast("Skipped. No penalty."); rerender(); break;
    case "filter": chFilter = v; rerender(); break;
    case "pick": p.current_challenge_id = v; p.current_predicted_anxiety = null; td = { adapted: false, pred: 5 }; save(); toast("Set as today's challenge"); go("today"); break;
    case "pgoal": toggle(p.goals, v, 3); save(); rerender(); break;
    case "phard": toggle(p.hardest, v, 2); save(); rerender(); break;
    case "theme": setTheme(v); break;
    case "wall": setWall(v); break;
    case "recal": p.onboarded = false; save(); ob = { step: 0, answers: {}, goals: [...p.goals], hardest: [...p.hardest] }; go("onboarding"); break;
    case "signout": db.session = null; save(); go("welcome"); break;
    case "reset": resetAll(); break;

});
function setTheme(t) {
  try { localStorage.setItem("cz-theme", t); } catch (e) {}
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const s = $(".seg3"); if (s) { s.style.setProperty("--i", ["light", "auto", "dark"].indexOf(t)); $$("button", s).forEach(b => b.setAttribute("aria-checked", b.dataset.v === t)); }
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (theme() === "auto") setTheme("auto"); });
function calibrationSheet() {
  let actual = 3, text = "";
  openSheet(`<h2>How did it feel?</h2><p class="lede" style="font-size:16px">${CHALLENGES[0].title}</p>
    <label class="field"><span>What happened</span><textarea class="input" id="refl" maxlength="2000" placeholder="A sentence or two is plenty."></textarea></label>
    ${meter("act", "How anxious did it actually feel?", 3)}
    <div class="btns col"><button class="btn primary" id="savecal">Save and see my first challenge</button></div>`, sh => {
    bindMeter(sh, "act", x => actual = x);
    $("#refl", sh).oninput = ev => text = ev.target.value;
    $("#savecal", sh).onclick = () => {
      saveOnboarding(ob);
      submitOutcome({ outcome: "completed", predictedAnxiety: null, actualAnxiety: actual, reflection: text, challengeId: "c0" });
      ob = { step: 0, answers: {}, goals: [], hardest: [] };
      closeSheet(); toast("+15 XP · baseline saved"); go("today");
    };
  }, "Calibration");
}
function toggle(list, v, max) { const i = list.indexOf(v); if (i >= 0) list.splice(i, 1); else if (list.length < max) list.push(v); }
function resetAll() {
  db = { session: null, profile: freshProfile(), history: [] }; save();
  ob = { step: 0, answers: {}, goals: [], hardest: [] }; td = { adapted: false, pred: 5 };
  closeSheet(); go("welcome"); toast("Everything cleared");
}

// ---------- sample account ----------
function loadSample(dest = "today") {
  db = { session: { email: "sam@comfortzone.app" }, profile: freshProfile(), history: [] };
  db.profile.display_name = "Sam";
  saveOnboarding({ answers: { initiating: 1, depth: 2, groups: 2, speaking: 3, assertiveness: 2, visibility: 1, solo: 1 },
    goals: ["Make more friends", "Speak up more at work or school"], hardest: ["Speaking in front of a group"] });
  const day = d => new Date(Date.now() - d * 864e5);
  const plan = [
    ["c0", "completed", null, 3, "The barista actually smiled back. Weirdly nice.", 7],
    ["c2", "completed", 6, 3, "Asked someone at the station if this was the right platform. Took two seconds.", 6],
    ["c7", "completed", 5, 4, "Asked my sister how her new job actually felt. Long chat.", 5],
    ["c22", "completed", 7, 4, "Picked the restaurant for once. Nobody minded.", 4],
    ["c18", "attempted", 8, 7, "Started explaining, then let someone else finish. Next time.", 3],
    ["c27", "completed", 6, 3, "Said thanks and didn't deflect. Felt odd but fine.", 2],
    ["c33", "adapted_completed", 7, 4, "Did the easier version: coffee alone, no phone.", 1],
  ];
  for (const [id, outcome, pa, aa, txt, d] of plan) {
    db.profile.last_activity_date = isoDay(day(d + 1));
    submitOutcome({ outcome, predictedAnxiety: pa, actualAnxiety: aa, reflection: txt, challengeId: id }, day(d));
  }
  db.profile.last_activity_date = isoDay(day(1));
  db.profile.streak = 6; save();
  td = { adapted: false, pred: 5 };
  go(dest); toast("Sample account loaded");
}

if (location.hash === "#/sample") loadSample(); else render({ instant: true });
</script>
